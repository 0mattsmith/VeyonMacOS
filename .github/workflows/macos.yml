name: "macOS Builds"
on:
  push:
    branches:
      - '**'
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple silicon (arm64)
          - runner: macos-15-intel   # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    env:
      CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # optional - without these secrets, the bundles are signed ad-hoc and not notarized
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install ninja qt qca openssl@3 lzo jpeg-turbo libpng libvncserver

      - name: Import signing certificates
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -P "$MACOS_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificates.p12"
          if [ -n "$MACOS_NOTARY_APPLE_ID" ] ; then
            xcrun notarytool store-credentials veyon-notary --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --keychain "$keychain"
            echo "NOTARY_PROFILE=veyon-notary" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix qca);$(brew --prefix openssl@3)" \
            -DWITH_LTO=OFF \
            -DWITH_LDAP=OFF \
            -DVEYON_MACOS_SIGNING_IDENTITY="${MACOS_SIGNING_IDENTITY:--}" \
            -DVEYON_MACOS_INSTALLER_IDENTITY="${MACOS_INSTALLER_IDENTITY}" \
            -DVEYON_MACOS_NOTARY_PROFILE="${NOTARY_PROFILE:-}"

      - name: Build
        # keep going after errors so a single run reports all of them
        run: cmake --build build --parallel -- -k 0

      - name: Create bundles, installer package and disk image
        run: cmake --build build --target macos-package

      - name: Test bundled programs
        run: |
          cli=build/macos-staging/Veyon.app/Contents/MacOS/veyon-cli
          # on failure, show libraries loaded from outside the bundle (e.g. a second Qt from Homebrew) and a backtrace
          check() {
            "$@" && return 0
            status=$?
            echo "::group::Diagnostics for: $*"
            echo "--- libraries loaded from outside the bundle:"
            DYLD_PRINT_LIBRARIES=1 "$@" 2>&1 | grep -E "^dyld.*(/opt/homebrew|/usr/local)" | head -40 || true
            echo "--- backtrace:"
            lldb --batch -o run -k "thread backtrace all" -k "image list" -k quit -- "$@" 2>&1 | \
              grep -vE "^\[ *[0-9]+\] .* /(System|usr/lib)/" | tail -250 || true
            echo "::endgroup::"
            return $status
          }
          check "$cli" about
          check "$cli" addons list
          check "$cli" feature list > features.txt
          cat features.txt
          for feature in TaskManager VolumeManager FileManager FileSender WebPageSender InternetAccess WebsiteFilter ; do
            grep -qx "$feature" features.txt || { echo "::error::feature $feature not loaded" ; exit 1 ; }
          done

      - name: Test installer and uninstaller
        run: |
          sudo installer -pkg build/macos-dist/*.pkg -target /
          test -x /Applications/Veyon.app/Contents/MacOS/veyon-master
          test -x "/Applications/Veyon Configurator.app/Contents/MacOS/veyon-configurator-launcher"
          test -f /Library/LaunchDaemons/io.veyon.veyon-service.plist
          sleep 10
          sudo launchctl print system/io.veyon.veyon-service | grep -E "state|pid"
          sudo /Applications/Veyon.app/Contents/Resources/uninstall.sh --purge
          test ! -e /Applications/Veyon.app
          test ! -e "/Applications/Veyon Configurator.app"
          test ! -e /Library/LaunchDaemons/io.veyon.veyon-service.plist
          ! sudo launchctl print system/io.veyon.veyon-service > /dev/null 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: veyon-macos-${{ runner.arch }}
          path: build/macos-dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/macos-dist/*
