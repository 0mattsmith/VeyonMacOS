name: "macOS Builds"
on:
  push:
    branches:
      - '**'
    tags:
      - "v*.*.*"
    # changes which only affect other platforms don't need macOS builds
    paths-ignore:
      - '.ci/windows/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows.yml'
      - 'cmake/modules/WindowsInstaller.cmake'
      - 'nsis/**'
      - 'push.ps1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    # release commits (created by push.ps1 --bump) are built for their tag only, not for the branch push as well
    if: github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, 'Veyon-Release:')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple silicon (arm64)
          - runner: macos-15-intel   # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    env:
      CI_COMMIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # optional - without these secrets, the bundles are signed ad-hoc and not notarized
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        # openldap is keg-only (macOS ships a deprecated OpenLDAP 2.4) - it is bundled for the LDAP plugin,
        # which uses the SASL library of macOS (like Homebrew's openldap itself)
        run: brew install ninja qt qca openssl@3 lzo jpeg-turbo libpng libvncserver openldap

      - name: Import signing certificates
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -P "$MACOS_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificates.p12"
          if [ -n "$MACOS_NOTARY_APPLE_ID" ] ; then
            xcrun notarytool store-credentials veyon-notary --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --keychain "$keychain"
            echo "NOTARY_PROFILE=veyon-notary" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix qca);$(brew --prefix openssl@3);$(brew --prefix openldap)" \
            -DWITH_LTO=OFF \
            -DVEYON_MACOS_SIGNING_IDENTITY="${MACOS_SIGNING_IDENTITY:--}" \
            -DVEYON_MACOS_INSTALLER_IDENTITY="${MACOS_INSTALLER_IDENTITY}" \
            -DVEYON_MACOS_NOTARY_PROFILE="${NOTARY_PROFILE:-}"

      - name: Build
        # keep going after errors so a single run reports all of them
        run: cmake --build build --parallel -- -k 0

      - name: Create bundles, installer package and disk image
        run: cmake --build build --target macos-package

      - name: Test bundled programs
        run: |
          cli=build/macos-staging/Veyon.app/Contents/Helpers/veyon-cli
          # on failure, show libraries loaded from outside the bundle (e.g. a second Qt from Homebrew) and a backtrace
          check() {
            "$@" && return 0
            status=$?
            echo "::group::Diagnostics for: $*"
            echo "--- libraries loaded from outside the bundle:"
            DYLD_PRINT_LIBRARIES=1 "$@" 2>&1 | grep -E "^dyld.*(/opt/homebrew|/usr/local)" | head -40 || true
            echo "--- backtrace:"
            lldb --batch -o run -k "thread backtrace all" -k "image list" -k quit -- "$@" 2>&1 | \
              grep -vE "^\[ *[0-9]+\] .* /(System|usr/lib)/" | tail -250 || true
            echo "::endgroup::"
            return $status
          }
          check "$cli" about
          check "$cli" addons list
          check "$cli" feature list > features.txt
          cat features.txt
          for feature in TaskManager VolumeManager FileManager FileSender WebPageSender InternetAccess WebsiteFilter ; do
            grep -qx "$feature" features.txt || { echo "::error::feature $feature not loaded" ; exit 1 ; }
          done

          # the LDAP plugin (CLI module, Configurator page, directory and user groups backend) has to load
          # OpenLDAP from the bundle and the SASL library from macOS
          check "$cli" ldap help query
          DYLD_PRINT_LIBRARIES=1 "$cli" ldap help query 2>&1 | grep -E "/lib(ldap|lber|sasl2)[.]" > ldap-libraries.txt || true
          cat ldap-libraries.txt
          if ! grep -q "Veyon.app/.*/libldap[.]" ldap-libraries.txt || ! grep -q "Veyon.app/.*/liblber[.]" ldap-libraries.txt || \
             grep -qE "(/opt/homebrew|/usr/local)/" ldap-libraries.txt ; then
            echo "::error::the LDAP plugin does not use the bundled OpenLDAP libraries"
            exit 1
          fi

      - name: Test installer and uninstaller
        run: |
          sudo installer -pkg build/macos-dist/*.pkg -target /
          test -x /Applications/Veyon.app/Contents/MacOS/veyon-master
          test -x "/Applications/Veyon Configurator.app/Contents/MacOS/veyon-configurator-launcher"
          test -f /Library/LaunchDaemons/io.veyon.veyon-service.plist
          test -x /Applications/Veyon.app/Contents/Helpers/veyon-configurator
          test -f /Applications/Veyon.app/Contents/PlugIns/veyon/ldap.dylib
          test ! -e /Applications/Veyon.app/Contents/MacOS/veyon-server
          sleep 10
          sudo launchctl print system/io.veyon.veyon-service | grep -E "state|pid"
          pgrep -lx veyon-server || echo "(veyon-server is not running)"

          # open Veyon.app like Finder does while the service is running - Veyon Master has to start and keep running
          # (macOS must not treat the running veyon-server as an instance of Veyon.app)
          open /Applications/Veyon.app
          sleep 15
          if ! pgrep -x veyon-master > /dev/null ; then
            echo "::error::Veyon Master is not running after opening Veyon.app"
            lsappinfo list | grep -B2 -A6 -i "veyon" || true
            exit 1
          fi
          echo "Veyon Master is running"
          pkill -x veyon-master

          sudo /Applications/Veyon.app/Contents/Resources/uninstall.sh --purge
          test ! -e /Applications/Veyon.app
          test ! -e "/Applications/Veyon Configurator.app"
          test ! -e /Library/LaunchDaemons/io.veyon.veyon-service.plist
          ! sudo launchctl print system/io.veyon.veyon-service > /dev/null 2>&1

      - name: Test LDAP connections secured with TLS
        # with the TLS verify mode "Default", the LDAP plugin has to verify server certificates with the CA certificates
        # of macOS (/etc/ssl/cert.pem), as the CA certificates of Homebrew's OpenSSL don't exist without Homebrew. A local
        # slapd with a certificate issued by a test CA must not be trusted until this CA is added to /etc/ssl/cert.pem.
        run: |
          cli="$PWD/build/macos-staging/Veyon.app/Contents/Helpers/veyon-cli"
          prefix="$(brew --prefix)"
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          slapd="$(brew --prefix openldap)/libexec/slapd"
          dir="$RUNNER_TEMP/ldap-tls"
          ldaps_url="ldaps://localhost:6360"
          # kldap expects the StartTLS extension in the 4th URL query item - an empty 1st item would be dropped
          starttls_url="ldap://localhost:3890/?namingContexts?base??x-tls"
          slapd_pid=
          mkdir -p "$dir/db"
          cd "$dir"

          cleanup()
          {
            status=$?
            if [ -f cert.pem.orig ] ; then sudo cp cert.pem.orig /etc/ssl/cert.pem ; fi
            for hidden in "$prefix"/etc/openssl@*.hidden ; do
              if [ -d "$hidden" ] ; then mv "$hidden" "${hidden%.hidden}" ; fi
            done
            if [ -n "$slapd_pid" ] ; then kill "$slapd_pid" || true ; fi
            sudo "$cli" config clear || true
            if [ $status -ne 0 ] && [ -f slapd.log ] ; then
              echo "::group::slapd log" ; tail -100 slapd.log ; echo "::endgroup::"
            fi
          }
          trap cleanup EXIT

          # test CA and a server certificate for localhost issued by it
          cat > ca.ext <<EOF
          basicConstraints=critical,CA:TRUE
          keyUsage=critical,keyCertSign,cRLSign
          subjectKeyIdentifier=hash
          EOF
          cat > server.ext <<EOF
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid
          EOF
          "$openssl" req -new -newkey rsa:2048 -nodes -subj "/CN=Veyon CI LDAP test CA" -keyout ca.key -out ca.csr
          "$openssl" x509 -req -in ca.csr -signkey ca.key -days 2 -extfile ca.ext -out ca.pem
          "$openssl" req -new -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr
          "$openssl" x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -extfile server.ext -out server.pem

          cat > slapd.conf <<EOF
          include $prefix/etc/openldap/schema/core.schema
          pidfile $dir/slapd.pid
          argsfile $dir/slapd.args
          TLSCertificateFile $dir/server.pem
          TLSCertificateKeyFile $dir/server.key
          database ldif
          suffix "dc=example,dc=org"
          directory $dir/db
          EOF
          "$slapd" -f slapd.conf -h "ldap://localhost:3890/ ldaps://localhost:6360/" -d stats > slapd.log 2>&1 &
          slapd_pid=$!
          for i in $(seq 30) ; do
            nc -z localhost 3890 && nc -z localhost 6360 && break
            sleep 1
          done
          nc -z localhost 6360

          # like on computers without Homebrew, the default CA certificate locations of the bundled OpenSSL must not exist
          for openssldir in "$prefix"/etc/openssl@* ; do
            mv "$openssldir" "$openssldir.hidden"
          done

          # $1: connection security (1 = StartTLS, 2 = SSL), $2: TLS verify mode (0 = default, 2 = custom CA file), $3: URL
          query_base_dn()
          {
            echo "== Connection security $1, TLS verify mode $2, $3"
            sudo "$cli" config set LDAP/ConnectionSecurity "$1"
            sudo "$cli" config set LDAP/TLSVerifyMode "$2"
            sudo "$cli" ldap autoconfigurebasedn "$3" namingContexts 2>&1 | tee output.txt
            grep -q "dc=example,dc=org" output.txt
          }

          sudo "$cli" config set LDAP/TLSCACertificateFile "$dir/ca.pem"
          # the server works and its certificate is valid for the test CA
          query_base_dn 2 2 "$ldaps_url" || { echo "::error::LDAPS with a custom CA certificate file failed" ; exit 1 ; }
          # the test CA is not trusted by macOS yet, so certificate verification has to fail
          if query_base_dn 2 0 "$ldaps_url" ; then
            echo "::error::LDAPS succeeded although the server certificate is not trusted by macOS"
            exit 1
          fi

          sudo cp /etc/ssl/cert.pem cert.pem.orig
          sudo sh -c "cat '$dir/ca.pem' >> /etc/ssl/cert.pem"
          query_base_dn 2 0 "$ldaps_url" || { echo "::error::LDAPS with the CA certificates of macOS failed" ; exit 1 ; }
          query_base_dn 1 0 "$starttls_url" || { echo "::error::StartTLS with the CA certificates of macOS failed" ; exit 1 ; }

      - uses: actions/upload-artifact@v4
        with:
          name: veyon-macos-${{ runner.arch }}
          path: build/macos-dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/macos-dist/*
